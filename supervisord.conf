[supervisord]
user=root
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
childlogdir=/var/log/supervisor

[program:dbus]
command=/usr/bin/dbus-daemon --system --nofork --nopidfile
priority=10
autorestart=true
stdout_logfile=/var/log/supervisor/dbus.log
redirect_stderr=true

[program:vnc]
environment=HOME="/home/xuser",USER="xuser"
user=xuser
command=/usr/bin/tigervncserver -fg -localhost %(ENV_VNC_LOCALHOST)s -geometry %(ENV_RESOLUTION)s -xstartup /usr/bin/startxfce4 -SecurityTypes VncAuth -PasswordFile /home/xuser/.vnc/passwd :0
priority=20
autorestart=true
stdout_logfile=/var/log/supervisor/vnc.log
redirect_stderr=true

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 6080 localhost:5900
priority=30
autorestart=true
stdout_logfile=/var/log/supervisor/novnc.log
redirect_stderr=true

[program:xrdp-sesman]
command=/usr/sbin/xrdp-sesman --nodaemon
priority=40
autorestart=true
stdout_logfile=/var/log/supervisor/xrdp-sesman.log
redirect_stderr=true

[program:xrdp]
command=/usr/sbin/xrdp --nodaemon
priority=50
autorestart=true
stdout_logfile=/var/log/supervisor/xrdp.log
redirect_stderr=true
